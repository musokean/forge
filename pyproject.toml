[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "handcraft-agent"
version = "0.4.1"
description = "The readable ReAct agent: a ~235-line step loop you can follow, plus opt-in modules for sandboxing, memory and Computer Use."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "musokean" }]
keywords = ["ai-agent", "llm", "react", "multi-agent", "mcp", "deepseek", "openai-compatible", "computer-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.24",  # forge/llm.py 直接 import httpx（openai 的间接依赖不可靠，必须显式声明）
]

[project.urls]
Homepage = "https://github.com/musokean/forge"
Repository = "https://github.com/musokean/forge"
Changelog = "https://github.com/musokean/forge/blob/main/CHANGELOG.md"
Issues = "https://github.com/musokean/forge/issues"

[project.optional-dependencies]
# #14 服务化才需要（forge --serve）：核心仍是零重依赖，不装也不影响 CLI/Web
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# #16 硬件 Phase 1 才需要（串口 / MQTT 真链路）：核心仍零重依赖，不装也不影响 CLI/服务化
device = [
    "pyserial>=3.5",     # 串口/透传（COM5 · socket:// · loop://）
    "paho-mqtt>=2.0",    # MQTT 承载
]
# #11 语音模式（Phase 1 整句级 + Phase 2/3 流式/打断）才需要
voice = [
    "sounddevice>=0.4.6",   # 麦克风采集（真麦克风 / 也能喂文件）
    "numpy>=1.24",          # VAD 能量判定 / 音频块
    "edge-tts>=6.1",        # TTS（免费、中文自然）
    "openai-whisper>=20231117",  # STT（本地跑，base 模型；中文精度要求高可换 small）
]
# #17 客户端执行器的 GUI 能力（截屏/鼠标键盘）才需要：不装则该能力如实报不可用（不假装有）
executor = [
    "pyautogui>=0.9.54",
    "pillow>=10.0",
]

# 控制台入口：pip 装完直接可用（不必 clone 仓库）
[project.scripts]
forge = "main:main"
forge-executor = "executor_agent:main"      # #17 被控 PC 上的客户端执行器
forge-device-sim = "device_sim:main"        # #16 设备端模拟器（说真协议）

[tool.setuptools]
py-modules = ["main", "executor_agent", "device_sim"]
packages = ["forge"]

[tool.pytest.ini_options]
# 本地 `pytest .` 的坑：release/ 是 build_release.py 生成的副本目录，里面有 test_*.py 的同名拷贝，
# 不排除会报 import file mismatch（CI 用显式白名单不受影响，本地全量跑才炸）
norecursedirs = ["release", "build", "dist", "data", "exports", ".git", "__pycache__", ".workbuddy", "node_modules", "hardware"]
testpaths = []
