[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "handcraft-agent"
version = "0.1.0"
description = "Config-driven multi-model AI agent with a readable codebase (learnable, production-ready)"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.24",  # src/llm.py 直接 import httpx（openai 的间接依赖不可靠，必须显式声明）
]

[project.scripts]
forge = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]
