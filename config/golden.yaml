# ==============================================================================
# forge · 黄金集（#13 评估 / A10 防变笨）
# ------------------------------------------------------------------------------
# 每次对 forge 做结构性改动（prompt / 角色 / 模型 / 路由 / 技能）后，跑 /eval 回归：
#   · task      ：标准问答任务（forge 将真实执行，含工具调用）
#   · keywords  ：期望答案必须包含的关键词（程序化硬指标，全命中才算过）
#   · min_score ：LLM-as-judge 评审最低分 0-10（评审不可用时只看关键词）
#   · note      ：备注（这例验证什么能力）
# 添加用例：/eval add 任务|关键词1,关键词2|最低分，或直接编辑本文件。
# ==============================================================================
golden:
  - task: '计算 17 × 23 等于多少？'
    keywords: ['391']
    min_score: 6

  - task: '1 公里等于多少米？'
    keywords: ['1000']
    min_score: 6

  - task: '列出当前工作目录下的文件和子目录。'
    keywords: ['main.py', 'src']
    min_score: 6

  - task: '用一句话介绍 forge 是什么。'
    keywords: ['AI', '助手', '模型']
    min_score: 6

  - task: '在知识库里搜索「自动化」相关内容。'
    keywords: ['自动任务', '调度']
    min_score: 5

  - task: '今天的日期是什么？'
    keywords: ['2026']
    min_score: 5

